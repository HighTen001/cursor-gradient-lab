<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>06 — Stardust Particle Trail | Cursor Gradient Lab</title>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=satoshi@400,500,700&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050508;
      color: #ffffff;
      font-family: 'Satoshi', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #particle-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      padding: 3rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .back-btn {
      pointer-events: auto;
      font-family: 'Clash Display', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #00F0FF;
      text-decoration: none;
      padding: 0.6rem 1.2rem;
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }
    .back-btn:hover {
      background: #00F0FF;
      color: #000000;
    }
    .demo-tag {
      font-family: 'Clash Display', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      color: rgba(255, 255, 255, 0.6);
    }
    .hud-bottom {
      max-width: 500px;
    }
    .hud-title {
      font-family: 'Clash Display', sans-serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      line-height: 1;
      margin-bottom: 0.75rem;
    }
    .hud-desc {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <canvas id="particle-canvas"></canvas>

  <div class="hud">
    <div class="hud-top">
      <a href="../index.html" class="back-btn">&larr; BACK TO GALLERY</a>
      <span class="demo-tag">DEMO 06 / 08</span>
    </div>
    <div class="hud-bottom">
      <h1 class="hud-title">STARDUST PARTICLE TRAIL</h1>
      <p class="hud-desc">Dynamic particle stream emitting glowing stardust along mouse trajectory with physics velocity & decay.</p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const particles = [];
    const colors = ['#00F0FF', '#FF7ABD', '#9456ED', '#D3A140'];

    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 4 + 2;
        this.color = colors[Math.floor(Math.random() * colors.length)];
        
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 0.5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        
        this.life = 1;
        this.decay = Math.random() * 0.02 + 0.01;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.96;
        this.vy *= 0.96;
        this.life -= this.decay;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();

        // Glow ring
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.restore();
      }
    }

    let mouse = { x: -100, y: -100, prevX: -100, prevY: -100 };

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;

      const dist = Math.hypot(mouse.x - mouse.prevX, mouse.y - mouse.prevY);
      const spawnCount = Math.min(Math.floor(dist / 4) + 1, 8);

      for (let i = 0; i < spawnCount; i++) {
        particles.push(new Particle(mouse.x, mouse.y));
      }

      mouse.prevX = mouse.x;
      mouse.prevY = mouse.y;
    });

    function animate() {
      ctx.fillStyle = '#050508';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.globalCompositeOperation = 'lighter';

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();

        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }

      ctx.globalCompositeOperation = 'source-over';

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
