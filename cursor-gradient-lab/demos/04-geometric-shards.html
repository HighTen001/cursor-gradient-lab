<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>04 — Geometric Shards | Cursor Gradient Lab</title>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=satoshi@400,500,700&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080705;
      color: #ffffff;
      font-family: 'Satoshi', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #shards-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      padding: 3rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .back-btn {
      pointer-events: auto;
      font-family: 'Clash Display', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #D3A140;
      text-decoration: none;
      padding: 0.6rem 1.2rem;
      border: 1px solid rgba(211, 161, 64, 0.3);
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }
    .back-btn:hover {
      background: #D3A140;
      color: #000000;
    }
    .demo-tag {
      font-family: 'Clash Display', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      color: rgba(255, 255, 255, 0.6);
    }
    .hud-bottom {
      max-width: 500px;
    }
    .hud-title {
      font-family: 'Clash Display', sans-serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      line-height: 1;
      margin-bottom: 0.75rem;
    }
    .hud-desc {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.5;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <canvas id="shards-canvas"></canvas>

  <div class="hud">
    <div class="hud-top">
      <a href="../index.html" class="back-btn">&larr; BACK TO GALLERY</a>
      <span class="demo-tag">DEMO 04 / 08</span>
    </div>
    <div class="hud-bottom">
      <h1 class="hud-title">GEOMETRIC SHARDS</h1>
      <p class="hud-desc">3D low-poly crystal shards that magnetically align toward pointer gravity in real time.</p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('shards-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 12;

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Lights
    const ambientLight = new THREE.AmbientLight(0x222222);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xD3A140, 2, 30);
    scene.add(pointLight);

    const cyanLight = new THREE.PointLight(0x00F0FF, 1.5, 30);
    cyanLight.position.set(-5, -5, 5);
    scene.add(cyanLight);

    // Create Shards Grid
    const shards = [];
    const count = 36;

    const geometries = [
      new THREE.OctahedronGeometry(0.6, 0),
      new THREE.TetrahedronGeometry(0.7, 0),
      new THREE.ConeGeometry(0.5, 1.2, 4)
    ];

    for (let i = 0; i < count; i++) {
      const geo = geometries[i % geometries.length];
      const mat = new THREE.MeshStandardMaterial({
        color: 0x111115,
        roughness: 0.3,
        metalness: 0.8,
        wireframe: false
      });

      const mesh = new THREE.Mesh(geo, mat);

      // Wireframe overlay edge lines
      const wireMat = new THREE.MeshBasicMaterial({ color: 0xD3A140, wireframe: true, transparent: true, opacity: 0.25 });
      const wireMesh = new THREE.Mesh(geo, wireMat);
      mesh.add(wireMesh);

      mesh.position.x = (Math.random() - 0.5) * 16;
      mesh.position.y = (Math.random() - 0.5) * 10;
      mesh.position.z = (Math.random() - 0.5) * 6;

      mesh.userData = {
        baseX: mesh.position.x,
        baseY: mesh.position.y,
        rotSpeedX: (Math.random() - 0.5) * 0.02,
        rotSpeedY: (Math.random() - 0.5) * 0.02
      };

      scene.add(mesh);
      shards.push(mesh);
    }

    const mouse3D = new THREE.Vector3(0, 0, 0);

    window.addEventListener('mousemove', (e) => {
      // Normalize to 3D world space coordinates
      mouse3D.x = (e.clientX / window.innerWidth) * 16 - 8;
      mouse3D.y = -(e.clientY / window.innerHeight) * 10 + 5;
      mouse3D.z = 2;

      pointLight.position.set(mouse3D.x, mouse3D.y, 4);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);

      shards.forEach((shard) => {
        // Slow float
        shard.position.x = shard.userData.baseX + Math.sin(Date.now() * 0.001 + shard.userData.baseX) * 0.3;
        shard.position.y = shard.userData.baseY + Math.cos(Date.now() * 0.001 + shard.userData.baseY) * 0.3;

        // Orient toward cursor
        const targetRot = Math.atan2(mouse3D.y - shard.position.y, mouse3D.x - shard.position.x);
        shard.rotation.z += (targetRot - shard.rotation.z) * 0.05;
        shard.rotation.x += shard.userData.rotSpeedX;
        shard.rotation.y += shard.userData.rotSpeedY;
      });

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
